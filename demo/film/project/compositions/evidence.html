  <script>
    (function () {
      const tl = gsap.timeline({ paused: true, defaults: { immediateRender: false } });
      const $ = (s) => document.querySelector(s);
      const $$ = (s) => Array.from(document.querySelectorAll(s));
      const roll = $("#ev-roll");
      const BLUR0 = "blur(0px)";
      const FOCUS = 860; // where the newest printed row's bottom sits
      const topIn = (el) => {
        let y = 0;
        for (let n = el; n && n !== roll; n = n.offsetParent) y += n.offsetTop;
        return y;
      };

      gsap.set(roll, { x: -90, y: 0, scale: 1, transformOrigin: "0 0" });

      // The chapter line, word by word.
      $$("#ev-chapter .w").forEach((w, i) =>
        tl.fromTo(w, { opacity: 0, filter: "blur(6px)" }, { opacity: 1, filter: BLUR0, duration: 0.13, ease: "power4.out" }, 0.2 + i * 0.07),
      );

      // Stamps sit beside the closing line of their slip.
      $$("#ev-roll .close[data-stamp]").forEach((c) => {
        document.getElementById(c.dataset.stamp).style.top = c.offsetTop + 70 + "px";
      });

      // Rows print in order; the camera keeps the newest row in view and only moves up the paper.
      const rows = $$("#ev-roll .r[data-t]").sort((a, b) => a.dataset.t - b.dataset.t);
      let y = 0;
      rows.forEach((row, i) => {
        const t = parseFloat(row.dataset.t);
        const top = topIn(row);
        const target = row.dataset.anchor ? parseFloat(row.dataset.anchor) - top : FOCUS - (top + row.offsetHeight);
        tl.fromTo(row, { opacity: 0 }, { opacity: 1, duration: 0.08 }, t);
        if (target < y) {
          const next = rows[i + 1] ? parseFloat(rows[i + 1].dataset.t) : t + 1;
          tl.fromTo(roll, { y: y }, { y: target, duration: Math.min(0.45, next - t - 0.02), ease: "power2.inOut" }, t);
          y = target;
        }
      });

      // The recording: first frame before it plays, last frame after.
      tl.fromTo("#ev-last", { opacity: 0 }, { opacity: 1, duration: 0.01 }, 13.08);
      tl.fromTo("#ev-phone", { opacity: 0, filter: "blur(6px)" }, { opacity: 1, filter: BLUR0, duration: 0.2, ease: "power4.out" }, 13.0);

      // Stamps.
      $$("#ev-roll .stamp").forEach((s) => {
        const t = parseFloat(s.dataset.t), rot = parseFloat(s.dataset.rot);
        tl.fromTo(s, { opacity: 0, scale: 1.4, rotation: rot }, { opacity: 1, scale: 1, rotation: rot, duration: 0.12, ease: "power4.in" }, t);
      });

      // Pull back: the whole roll of receipts, cobalt around it.
      const top1 = topIn($("#ev-s1")) - 20;
      const s4 = $("#ev-s4");
      const bot = topIn(s4) + s4.offsetHeight + 20;
      const sc = 980 / (bot - top1);
      tl.fromTo("#ev-s0", { opacity: 1 }, { opacity: 0, duration: 0.3 }, 26.1);
      tl.fromTo(roll, { x: -90, y: y, scale: 1 }, { x: 1440 - 1050 * sc, y: 50 - top1 * sc, scale: sc, duration: 1.4, ease: "power2.inOut" }, 26.1);

      window.__timelines["evidence"] = tl;
    })();
  </script>
