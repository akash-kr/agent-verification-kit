  <script>
    (function () {
      const tl = gsap.timeline({ paused: true, defaults: { immediateRender: false } });
      const $ = (s) => document.querySelector(s);
      const $$ = (s) => Array.from(document.querySelectorAll(s));
      const BLUR0 = "blur(0px)";

      // Titles: per-word blur in, per-word blur out.
      const wordsIn = (sel, t) =>
        $$(sel + " .w").forEach((w, i) =>
          tl.fromTo(w, { opacity: 0, filter: "blur(6px)" }, { opacity: 1, filter: BLUR0, duration: 0.13, ease: "power4.out" }, t + i * 0.07),
        );
      const wordsOut = (sel, t) =>
        $$(sel + " .w").forEach((w, i) =>
          tl.fromTo(w, { opacity: 1, filter: BLUR0 }, { opacity: 0, filter: "blur(8px)", duration: 0.18, ease: "power3.in" }, t + i * 0.03),
        );
      wordsOut("#ct-t1", 4.05);
      wordsIn("#ct-t2", 4.42);
      wordsOut("#ct-t2", 7.5);
      wordsIn("#ct-t3", 8.1);
      wordsOut("#ct-t3", 12.15);
      wordsIn("#ct-t4", 12.5);
      wordsOut("#ct-t4", 14.95);
      wordsIn("#ct-t5", 15.45);
      wordsOut("#ct-t5", 18.85);

      // Terminal lines: typed (one step per character) or printed at once.
      $$("#ct-term .ln[data-t]").forEach((el) => {
        const t = parseFloat(el.dataset.t);
        const tx = el.querySelector(".tx");
        if (el.dataset.cps) {
          const n = tx.textContent.length;
          tl.fromTo(el, { opacity: 0 }, { opacity: 1, duration: 0.01 }, t);
          tl.fromTo(tx, { clipPath: "inset(0 100% 0 0)" }, { clipPath: "inset(0 0% 0 0)", duration: n * parseFloat(el.dataset.cps), ease: "steps(" + n + ")" }, t);
        } else {
          tl.fromTo(el, { opacity: 0 }, { opacity: 1, duration: 0.06 }, t);
        }
      });
      // Page swaps: blur out the old page on the same stage.
      tl.fromTo("#ct-p1", { opacity: 1, filter: BLUR0 }, { opacity: 0, filter: "blur(8px)", duration: 0.2, ease: "power3.in" }, 7.65);
      tl.fromTo("#ct-p2", { opacity: 1, filter: BLUR0 }, { opacity: 0, filter: "blur(8px)", duration: 0.2, ease: "power3.in" }, 15.05);

      // Printing: the paper rises one row per step out of the slot.
      const SLOT = 972, PAD = 40, ROW = 42, STEP = 0.09;
      const finals = {}, heights = {};
      $$("#ct-pw .rcw").forEach((w) => {
        const start = parseFloat(w.dataset.print);
        const rows = w.querySelectorAll(".rrow").length;
        const H = PAD * 2 + rows * ROW;
        let prev = SLOT + 20;
        for (let k = 1; k <= rows + 1; k++) {
          const y = k <= rows ? SLOT - (PAD + k * ROW) : SLOT - H - 16;
          tl.fromTo(w, { y: prev }, { y: y, duration: 0.07, ease: "power2.out" }, start + (k - 1) * STEP);
          prev = y;
        }
        finals[w.id] = prev;
        heights[w.id] = H;
        gsap.set(w, { y: SLOT + 20 });
        tl.fromTo(w, { opacity: 0 }, { opacity: 1, duration: 0.01 }, start - 0.01);
      });

      // Stamps: a hit, and the paper jolts.
      $$("#ct-pw .stamp").forEach((s) => {
        const t = parseFloat(s.dataset.t);
        const rot = parseFloat(s.dataset.rot);
        const w = s.closest(".rcw");
        tl.fromTo(s, { opacity: 0, scale: 1.4, rotation: rot }, { opacity: 1, scale: 1, rotation: rot, duration: 0.12, ease: "power4.in" }, t);
        tl.fromTo(w, { y: finals[w.id] }, { y: finals[w.id] + 6, duration: 0.05, ease: "power2.out" }, t + 0.12);
        tl.fromTo(w, { y: finals[w.id] + 6 }, { y: finals[w.id], duration: 0.2, ease: "power2.out" }, t + 0.17);
      });

      // Tear 1: up and off. Tear 2: off to the right.
      const SH = "drop-shadow(0 18px 24px rgba(0, 0, 0, 0.35)) ";
      tl.fromTo("#ct-r1", { y: finals["ct-r1"], rotation: 0, filter: SH + BLUR0 }, { y: finals["ct-r1"] - 1150, rotation: -4, filter: SH + "blur(10px)", duration: 0.38, ease: "power3.in" }, 7.62);
      tl.fromTo("#ct-r2", { x: 0, rotation: 0, filter: SH + BLUR0 }, { x: 900, rotation: 7, filter: SH + "blur(10px)", duration: 0.36, ease: "power3.in" }, 15.0);

      // The name.
      tl.fromTo("#ct-term", { x: 0, opacity: 1, filter: BLUR0 }, { x: -160, opacity: 0, filter: "blur(10px)", duration: 0.35, ease: "power3.in" }, 18.95);
      $$("#ct-name .l").forEach((l, i) =>
        tl.fromTo(l, { opacity: 0, filter: "blur(4px)" }, { opacity: 1, filter: BLUR0, duration: 0.16, ease: "power4.out" }, 19.35 + i * 0.06),
      );
      wordsIn("#ct-sub", 20.0);

      // Out: the honest receipt grows into the next world.
      tl.fromTo(["#ct-name", "#ct-sub", "#ct-slot"], { opacity: 1, filter: BLUR0 }, { opacity: 0, filter: "blur(12px)", duration: 0.3, ease: "power3.in" }, 22.45);
      tl.set("#ct-flood", { opacity: 1 }, 22.45);
      const r3top = finals["ct-r3"], r3bot = 1080 - (finals["ct-r3"] + heights["ct-r3"]);
      tl.fromTo("#ct-flood", { clipPath: "inset(" + r3top + "px 120px " + r3bot + "px 1100px round 6px)" }, { clipPath: "inset(0px 0px 0px 0px round 0px)", duration: 0.65, ease: "power2.inOut" }, 22.45);

      window.__timelines["counter"] = tl;
    })();
  </script>
